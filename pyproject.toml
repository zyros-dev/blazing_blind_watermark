[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "blazing_blind_watermark"
version = "0.1.0"
description = "Fast blind watermarking in Rust"
requires-python = ">=3.8"
dependencies = []

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "blazing_blind_watermark._lib"
